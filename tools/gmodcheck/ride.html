<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
<script type="module">
// Draws the frames a fake-GMod ride capture recorded (game/tests/capture_ride.lua): the rider's view exactly as the
// renderer drew it, and a view from above. ride.js saves every picture.
import * as THREE from 'three';
const Q = new URLSearchParams(location.search);
const W = +(Q.get('w') || 640), H = +(Q.get('h') || 360);
const cap = await (await fetch(Q.get('cap') + '.json')).json();
const buf = await (await fetch(Q.get('cap') + '.bin')).arrayBuffer();
const U = cap.unit, sky = '#c4d8e8';
// px > 1: the pixel-art filter, drawn small and stretched with sharp pixels like the game does
const PX = +(Q.get('px') || 1);
const r = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true }); r.setSize(Math.ceil(W / PX), Math.ceil(H / PX)); document.body.appendChild(r.domElement);
const out = document.createElement('canvas'); out.width = W; out.height = H;
const octx = out.getContext('2d'); octx.imageSmoothingEnabled = false;
// edges = 1 (with px > 1): the pixel-art look's outlines, as the game draws them: dark where an object stands in front
// of something farther away, light along ridges (after Kody King's three.js pixel pass and Eduardo Schildt's
// 3DPixelArt_Tutorial). A pass of view-space facet normals and depth, then a full-screen pass over the small picture.
const EDGES = +(Q.get('edges') || 0) && PX > 1;
const LW = Math.ceil(W / PX), LH = Math.ceil(H / PX);
let rtCol, rtND, post, postScene, postCam;
if (EDGES) {
  rtCol = new THREE.WebGLRenderTarget(LW, LH, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, type: THREE.HalfFloatType });
  rtND = new THREE.WebGLRenderTarget(LW, LH, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, type: THREE.FloatType });
  post = new THREE.ShaderMaterial({
    uniforms: { tCol: { value: rtCol.texture }, tND: { value: rtND.texture }, texel: { value: new THREE.Vector2(1 / LW, 1 / LH) },
      silhouette: { value: +(Q.get('sil') || 0.12) }, dark: { value: +(Q.get('dark') || 0.5) }, light: { value: +(Q.get('light') || 0) },
      ridge: { value: +(Q.get('ridge') || 0.4) } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: `
      uniform sampler2D tCol, tND; uniform vec2 texel; uniform float silhouette, dark, light, ridge; varying vec2 vUv;
      vec4 nd(vec2 o){ return texture2D(tND, vUv + o * texel); }
      void main(){
        vec4 c = texture2D(tCol, vUv); vec4 m = nd(vec2(0.0));
        vec3 col = c.rgb;
        if (m.a < 1e4) {
          float w = 1.0 / m.a;                    // 1/depth is linear across a flat surface on screen
          vec2 dirs[4]; dirs[0] = vec2(1.0, 0.0); dirs[1] = vec2(-1.0, 0.0); dirs[2] = vec2(0.0, 1.0); dirs[3] = vec2(0.0, -1.0);
          float sil = 0.0, rid = 0.0;
          for (int i = 0; i < 4; i++) {
            vec4 a = nd(dirs[i]), b = nd(-dirs[i]);
            float wa = a.a < 1e4 ? 1.0 / a.a : 0.0, wb = b.a < 1e4 ? 1.0 / b.a : 0.0;
            float pred = 2.0 * w - wb;            // where the neighbour would be if the surface went on flat
            // the neighbour is much farther than the surface going on: this pixel is an object's edge in front of it
            if (wa < pred * (1.0 - silhouette) && wa < w * (1.0 - silhouette * 0.5)) sil = 1.0;
            // a ridge: the facing turns away (convex), at about the same depth
            vec3 na = a.xyz, n = m.xyz;
            bool solid = length(n) > 0.75 && length(na) > 0.75;     // leaf cards (half-length normals) get no ridges
            float turn = dot(n - na, normalize(vec3(1.0, 1.0, 1.0)));
            if (solid && a.a < 1e4 && abs(wa - w) < w * 0.08 && dot(n, na) < 1.0 - ridge && turn > 0.0) rid = 1.0;
          }
          if (sil > 0.0) col *= 1.0 - dark;
          else if (rid > 0.0) col *= 1.0 + light;
        }
        gl_FragColor = vec4(col, 1.0);
        #include <colorspace_fragment>
      }`,
    depthTest: false, depthWrite: false });
  postScene = new THREE.Scene(); postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post));
  postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
}
// facet normal (view space) and distance in metres; leaves cut out like the picture
const ndMats = {};
function ndMat(src, texname) {
  const foliage = /trees3d\//.test(texname || '') && !/bark/.test(texname || '');   // leaf cards: outlines, no ridges
  const key = (src.map ? src.map.uuid : 'none') + foliage;
  return ndMats[key] || (ndMats[key] = new THREE.ShaderMaterial({
    uniforms: { map: { value: src.map }, hasMap: { value: src.map ? 1 : 0 }, U: { value: U }, ridgeOK: { value: foliage ? 0.5 : 1.0 } },
    vertexShader: 'varying vec2 vUv; varying vec3 vView; void main(){ vUv = uv; vec4 v = modelViewMatrix * vec4(position, 1.0); vView = v.xyz; gl_Position = projectionMatrix * v; }',
    fragmentShader: `uniform sampler2D map; uniform int hasMap; uniform float U, ridgeOK; varying vec2 vUv; varying vec3 vView;
      void main(){ if (hasMap == 1 && texture2D(map, vUv).a < 0.5) discard;
        vec3 n = normalize(cross(dFdx(vView), dFdy(vView)));
        gl_FragColor = vec4(n * ridgeOK, length(vView) / U); }`,
    side: THREE.DoubleSide }));
}
function renderEdges(far, near, cam) {
  r.setRenderTarget(rtCol); r.autoClear = true; r.render(far, cam); r.autoClear = false; r.clearDepth(); r.render(near, cam);
  const saved = new Map(); near.traverse(o => { if (o.isMesh) { saved.set(o, o.material); o.material = ndMat(o.material, o.userData.tex); } });
  const bg = near.background, fg = near.fog; near.background = null; near.fog = null;
  r.setRenderTarget(rtND); r.setClearColor(0x000000, 1); r.autoClear = true;
  r.setClearAlpha(1); r.clear(); 
  // "nothing here" = very far: clear alpha cannot hold 1e5, so draw the pass over a far clear quad
  r.getContext().clearColor(0, 0, 0, 1e6); r.getContext().clear(r.getContext().COLOR_BUFFER_BIT | r.getContext().DEPTH_BUFFER_BIT);
  r.autoClear = false; r.render(near, cam);
  for (const [o, m] of saved) o.material = m;
  near.background = bg; near.fog = fg;
  r.setRenderTarget(null); r.autoClear = true; r.render(postScene, postCam);
  r.setClearColor(sky, 1);
}
const shot = () => { if (PX <= 1) return r.domElement.toDataURL('image/jpeg', 0.9); octx.drawImage(r.domElement, 0, 0, W, H); return out.toDataURL('image/jpeg', 0.9); };
const scene = new THREE.Scene(); scene.background = new THREE.Color(sky);
const fog = new THREE.Fog(sky, 300 * U, 2000 * U);
const MAT = Q.get('mat');
const tl = new THREE.TextureLoader();
// smooth = 1: textures filtered smoothly (with the pixel filter the whole picture makes the pixels, as in the game)
const SMOOTH = +(Q.get('smooth') || 0);
const texCache = {};
const tex = p => texCache[p] || (texCache[p] = new Promise(res => tl.load(MAT + '/' + p, t => { if (SMOOTH) { t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter; t.anisotropy = 8; } else t.magFilter = t.minFilter = THREE.NearestFilter; t.flipY = false; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; res(t); }, undefined, () => res(null))));
const mats = {};
async function material(texname) {
  if (mats[texname]) return mats[texname];
  const t = texname && texname !== 'color/white' ? await tex(texname) : null;
  return mats[texname] = new THREE.MeshBasicMaterial({ map: t, vertexColors: true, side: THREE.DoubleSide, alphaTest: 0.5, color: (t || texname === 'color/white') ? 0xffffff : 0xff00ff });
}
const byId = {}; for (const m of cap.meshes) byId[m.id] = m;
const objs = {};
async function obj(id) {
  if (objs[id]) return objs[id];
  const m = byId[id], n = m.verts, a = new Float32Array(buf, m.off, n * 8);
  const pos = new Float32Array(n * 3), uv = new Float32Array(n * 2), col = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { pos[i*3] = a[i*8]; pos[i*3+1] = a[i*8+1]; pos[i*3+2] = a[i*8+2]; uv[i*2] = a[i*8+3]; uv[i*2+1] = a[i*8+4];
    for (let c = 0; c < 3; c++) col[i*3+c] = Math.pow(a[i*8+5+c] / 255, 2.2); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.BufferAttribute(uv, 2)); g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const o = new THREE.Mesh(g, await material(m.tex)); o.userData.tex = m.tex;
  return objs[id] = o;
}
const riderBox = new THREE.Mesh(new THREE.BoxGeometry(1.8 * U, 0.5 * U, 1.7 * U), new THREE.MeshBasicMaterial({ color: 0xc8392f }));
const marker = new THREE.Mesh(new THREE.ConeGeometry(4 * U, 10 * U, 4), new THREE.MeshBasicMaterial({ color: 0xff2020 }));
const vfov = 2 * Math.atan(Math.tan(75 * Math.PI / 360) * 0.75) * 180 / Math.PI;
const cam = new THREE.PerspectiveCamera(vfov, W / H, 4, 2400 * U);
const top = new THREE.OrthographicCamera(-160 * U * W / H, 160 * U * W / H, 160 * U, -160 * U, 1, 3000 * U);
const from = +(Q.get('from') || 0), to = Math.min(cap.frames.length, +(Q.get('to') || 1e9));
for (let fi = from; fi < to; fi++) {
  const f = cap.frames[fi];
  // two passes like the game: distant ground, depth cleared, then the built cells and the rider
  const far = new THREE.Scene(), near = scene;
  far.background = new THREE.Color(sky);
  while (near.children.length) near.remove(near.children[0]);
  const clear = f.clear || 0;
  for (let i = 0; i < f.draws.length; i++) {
    const d = f.draws[i];
    let o = await obj(d[0]);
    if (d.length > 4) {      // a turned part (the rider): its own copy with the full matrix
      o = o.clone();
      o.matrixAutoUpdate = false;
      o.matrix.set(d[4], d[5], d[6], d[1], d[7], d[8], d[9], d[2], d[10], d[11], d[12], d[3], 0, 0, 0, 1);
    } else o.position.set(d[1], d[2], d[3]);
    (i < clear ? far : near).add(o);
  }
  const [rx, ry, rz] = f.rider, hd = f.heading * Math.PI / 180;
  if (!f.draws.some(d => d.length > 4)) { riderBox.position.set(rx, ry, rz + 0.85 * U); riderBox.rotation.set(0, 0, hd); near.add(riderBox); }
  near.background = null;
  far.fog = fog; near.fog = fog;
  const c = f.camera, p = c.ang[0] * Math.PI / 180, y = c.ang[1] * Math.PI / 180;
  cam.up.set(0, 0, 1); cam.position.set(...c.pos);
  cam.lookAt(c.pos[0] + Math.cos(p) * Math.cos(y), c.pos[1] + Math.cos(p) * Math.sin(y), c.pos[2] - Math.sin(p));
  if (EDGES) renderEdges(far, near, cam);
  else { r.autoClear = true; r.render(far, cam); r.autoClear = false; r.clearDepth(); r.render(near, cam); }
  await window.save(`${String(fi).padStart(4, '0')}_a.jpg`, shot());
  r.autoClear = true;
  // move the distant ground into the top view too (under the cells)
  for (const o of [...far.children]) { far.remove(o); o.position.z -= 30 * U; near.add(o); }
  near.background = new THREE.Color(sky);
  // from above, north up, 320 m tall, rider in the middle (red arrow)
  near.fog = null;
  marker.position.set(rx, ry, rz + 40 * U); marker.rotation.set(0, 0, hd - Math.PI / 2); marker.scale.set(1, 1, 0.05); near.add(marker);
  top.position.set(rx, ry, rz + 1500 * U); top.up.set(0, 1, 0); top.lookAt(rx, ry, rz); top.updateProjectionMatrix();
  r.render(near, top);
  await window.save(`${String(fi).padStart(4, '0')}_b.jpg`, shot());
  near.remove(marker);
}
window.DONE = true;
</script></body></html>
